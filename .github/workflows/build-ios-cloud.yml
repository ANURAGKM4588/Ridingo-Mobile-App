name: Build iOS Package on Cloud macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode iOS Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Xcode Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIDINGO-iOS-AppStore-Archive
          path: ios/App/build/App.xcarchive
