name: Build iOS Package on Cloud macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Real Device App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build build

      - name: Package Real iPhone IPA for Diawi
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r RIDINGO-iOS-Device.ipa Payload

      - name: Upload Diawi Ready IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIDINGO-iOS-Diawi-Package
          path: ios/App/build/Build/Products/Release-iphoneos/RIDINGO-iOS-Device.ipa
