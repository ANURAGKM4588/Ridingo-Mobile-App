name: Build Native Mobile Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Subproject Gradle AGP Versions
        run: |
          node -e "
          const fs = require('fs');
          ['android/capacitor-cordova-android-plugins/build.gradle', 'node_modules/@capacitor/android/capacitor/build.gradle'].forEach(p => {
            if (fs.existsSync(p)) {
              let c = fs.readFileSync(p, 'utf8');
              c = c.replace(/classpath 'com\.android\.tools\.build:gradle:8\.13\.0'/g, \"classpath 'com.android.tools.build:gradle:8.2.1'\");
              fs.writeFileSync(p, c);
            }
          });
          "

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --no-build-cache

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIDINGO-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIDINGO-Android-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

