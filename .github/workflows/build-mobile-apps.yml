name: Build Native Mobile Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Play Console AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIDINGO-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
